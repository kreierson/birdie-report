name: Site quality and public health
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: birdie-health-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test:seo
      - run: npm run build
  public-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/public-site-health.py
